<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Orvelle Ad</title>
<style>
  @font-face { font-family: 'Cormorant Garamond'; font-style: normal; font-weight: 300 500; src: url(fonts/cormorant.woff2) format('woff2'); }
  @font-face { font-family: 'Cormorant Garamond'; font-style: italic; font-weight: 300; src: url(fonts/cormorant-italic.woff2) format('woff2'); }
  @font-face { font-family: 'Inter'; font-style: normal; font-weight: 300 400; src: url(fonts/inter.woff2) format('woff2'); }
  html, body { margin: 0; background: #07040A; }
  #out { display: block; width: 1080px; height: 1920px; }
  @media (max-height: 1940px) { #out { height: 96vh; width: auto; aspect-ratio: 9/16; margin: 2vh auto; } }
</style>
<script type="importmap">
{ "imports": {
  "three": "./node_modules/three/build/three.module.js",
  "three/addons/": "./node_modules/three/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="out" width="1080" height="1920"></canvas>
<script type="module">
// ORVELLE — Midnight Saffron. 10s, 1080x1920. Every frame is worked out from time alone: window.seek(t).
// Look, colours, timing and "never" rules come from MOTION.md.
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { Reflector } from 'three/addons/objects/Reflector.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const W = 1080, H = 1920, DUR = 10;
const C = { night: '#07040A', plum: '#2A0F1F', saffron: '#F2A33A', gold: '#E8C27A', cream: '#F6EAD6' };

// ---------- helpers ----------
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, k) => a + (b - a) * k;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const eOut = k => 1 - Math.pow(1 - k, 3);
const eInOut = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const env = (t, a, b, c, d) => Math.min(eOut(prog(t, a, b)), 1 - eInOut(prog(t, c, d)));
let seed = 11;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

// ---------- renderer ----------
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H, false);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;

const scene = new THREE.Scene();
scene.background = new THREE.Color(C.night);
scene.fog = new THREE.FogExp2(C.night, 0.018);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.9;

const camera = new THREE.PerspectiveCamera(32, W / H, 0.05, 120);

// haze behind the bottle (plum), a big soft sprite
function radialTex(stops, size = 512) {
  const cv = document.createElement('canvas'); cv.width = cv.height = size;
  const g = cv.getContext('2d'), gr = g.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  stops.forEach(([o, c]) => gr.addColorStop(o, c));
  g.fillStyle = gr; g.fillRect(0, 0, size, size);
  const tx = new THREE.CanvasTexture(cv); tx.colorSpace = THREE.SRGBColorSpace; return tx;
}
const haze = new THREE.Mesh(new THREE.PlaneGeometry(16, 16), new THREE.MeshBasicMaterial({
  map: radialTex([[0, 'rgba(84,30,58,0.95)'], [0.4, 'rgba(42,15,31,0.8)'], [1, 'rgba(42,15,31,0)']]),
  transparent: true, depthWrite: false, fog: false }));
haze.position.set(0, 2.0, -9); haze.scale.setScalar(2.2);
scene.add(haze);
const glow = new THREE.Mesh(new THREE.PlaneGeometry(7, 7), new THREE.MeshBasicMaterial({
  map: radialTex([[0, 'rgba(242,163,58,0.32)'], [0.45, 'rgba(242,140,50,0.08)'], [1, 'rgba(242,163,58,0)']]),
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, fog: false }));
glow.position.set(0, 1.7, -2.2);
scene.add(glow);

// ---------- floor: dark mirror ----------
const mirror = new Reflector(new THREE.PlaneGeometry(40, 40), {
  textureWidth: 540, textureHeight: 960, color: 0x6a5a60, clipBias: 0.003 });
mirror.rotation.x = -Math.PI / 2;
scene.add(mirror);
const floorTint = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshBasicMaterial({
  color: C.night, transparent: true, opacity: 0.78 }));
floorTint.rotation.x = -Math.PI / 2; floorTint.position.y = 0.002;
scene.add(floorTint);

// ---------- bottle ----------
const bottle = new THREE.Group();
scene.add(bottle);
const glassMat = new THREE.MeshPhysicalMaterial({
  color: '#fff6ea', metalness: 0, roughness: 0.04, transmission: 1, thickness: 0.9, ior: 1.5,
  clearcoat: 1, clearcoatRoughness: 0.03, attenuationColor: '#ffe7c4', attenuationDistance: 3, specularIntensity: 1 });
const body = new THREE.Mesh(new RoundedBoxGeometry(1.6, 2.3, 0.9, 6, 0.16), glassMat);
body.position.y = 1.15; bottle.add(body);

const liquidMat = new THREE.MeshPhysicalMaterial({ color: '#b9561a', roughness: 0.12, metalness: 0,
  emissive: '#4a1804', emissiveIntensity: 0.4, clearcoat: 1, clearcoatRoughness: 0.05 });
const liquid = new THREE.Mesh(new RoundedBoxGeometry(1.3, 1.45, 0.6, 4, 0.1), liquidMat);
liquid.position.y = 0.92; bottle.add(liquid);

// label on the front face of the glass
function labelTex() {
  const cv = document.createElement('canvas'); cv.width = 1024; cv.height = 512;
  const g = cv.getContext('2d');
  g.fillStyle = 'rgba(12,5,9,0.92)'; g.fillRect(0, 0, 1024, 512);
  g.strokeStyle = C.gold; g.lineWidth = 6; g.strokeRect(22, 22, 980, 468);
  g.lineWidth = 2; g.strokeRect(40, 40, 944, 432);
  g.fillStyle = C.gold; g.textAlign = 'center';
  g.font = '300 170px "Cormorant Garamond"'; g.letterSpacing = '34px';
  g.fillText('ORVELLE', 529, 275);
  g.font = '400 46px Inter'; g.letterSpacing = '18px';
  g.fillText('MIDNIGHT SAFFRON', 521, 380);
  const tx = new THREE.CanvasTexture(cv); tx.colorSpace = THREE.SRGBColorSpace; tx.anisotropy = 8; return tx;
}
const label = new THREE.Mesh(new THREE.PlaneGeometry(0.92, 0.46),
  new THREE.MeshPhysicalMaterial({ roughness: 0.45, metalness: 0.2, clearcoat: 0.3 }));
label.position.set(0, 1.0, 0.452); bottle.add(label);

const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.22, 0.22, 48), glassMat);
neck.position.y = 2.4; bottle.add(neck);
const goldMat = new THREE.MeshStandardMaterial({ color: C.gold, metalness: 1, roughness: 0.18 });
const collar = new THREE.Mesh(new THREE.CylinderGeometry(0.36, 0.36, 0.2, 64), goldMat);
collar.position.y = 2.56; bottle.add(collar);
const capMat = new THREE.MeshPhysicalMaterial({ color: '#0d0709', roughness: 0.32, metalness: 0.1, clearcoat: 1, clearcoatRoughness: 0.08 });
const cap = new THREE.Mesh(new RoundedBoxGeometry(0.86, 0.96, 0.86, 5, 0.05), capMat);
cap.position.y = 3.14; bottle.add(cap);
const band = new THREE.Mesh(new RoundedBoxGeometry(0.875, 0.05, 0.875, 2, 0.02), goldMat);
band.position.y = 2.74; bottle.add(band);

// ---------- lights: one warm key (sweeps once), a gold rim ----------
const key = new THREE.SpotLight(C.saffron, 60, 20, 0.5, 0.6, 1.6);
key.target.position.set(0, 1.5, 0); scene.add(key, key.target);
const rim = new THREE.SpotLight(C.gold, 40, 20, 0.6, 0.7, 1.6);
rim.position.set(-2.5, 5, -3.5); rim.target.position.set(0, 1.6, 0); scene.add(rim, rim.target);
const fill = new THREE.HemisphereLight('#5a2a40', '#07040A', 0.5); scene.add(fill);

// ---------- note cards (move in depth past the camera) ----------
function cardTex(word, sub, motif) {
  const cv = document.createElement('canvas'); cv.width = 640; cv.height = 900;
  const g = cv.getContext('2d');
  g.fillStyle = 'rgba(16,7,12,0.88)'; g.fillRect(0, 0, 640, 900);
  // motif panel
  g.save(); g.beginPath(); g.rect(40, 40, 560, 560); g.clip();
  const bg = g.createRadialGradient(320, 320, 20, 320, 320, 420);
  bg.addColorStop(0, '#3a1626'); bg.addColorStop(1, '#0c050a'); g.fillStyle = bg; g.fillRect(40, 40, 560, 560);
  let s = word.length * 977;
  const r = () => (s = (s * 16807) % 2147483647) / 2147483647;
  if (motif === 'threads') {
    for (let i = 0; i < 46; i++) {
      const x = 80 + r() * 480, y = 80 + r() * 480, a = r() * 6.28, L = 60 + r() * 90;
      g.strokeStyle = i % 3 ? '#c2361f' : '#f2a33a'; g.lineWidth = 3 + r() * 4; g.lineCap = 'round';
      g.beginPath(); g.moveTo(x, y);
      g.quadraticCurveTo(x + Math.cos(a + .6) * L * .6, y + Math.sin(a + .6) * L * .6, x + Math.cos(a) * L, y + Math.sin(a) * L); g.stroke();
    }
  } else if (motif === 'amber') {
    for (let i = 0; i < 7; i++) {
      const x = 120 + r() * 400, y = 120 + r() * 400, rad = 40 + r() * 110;
      const gg = g.createRadialGradient(x - rad * .3, y - rad * .3, 2, x, y, rad);
      gg.addColorStop(0, '#ffd38a'); gg.addColorStop(.5, '#e08a2a'); gg.addColorStop(1, 'rgba(120,50,10,0.0)');
      g.fillStyle = gg; g.beginPath(); g.arc(x, y, rad, 0, 6.283); g.fill();
    }
  } else {
    for (let i = 0; i < 60; i++) {
      g.strokeStyle = `rgba(${140 + r() * 60},${80 + r() * 40},${40 + r() * 20},${.35 + r() * .5})`;
      g.lineWidth = 1 + r() * 4; g.beginPath();
      const y0 = 40 + i * 9.5;
      for (let x = 40; x <= 600; x += 10) g.lineTo(x, y0 + Math.sin(x / 70 + i * .3) * 14 + Math.sin(x / 23 + i) * 3);
      g.stroke();
    }
  }
  g.restore();
  g.strokeStyle = C.gold; g.lineWidth = 3; g.strokeRect(14, 14, 612, 872);
  g.textAlign = 'center';
  g.fillStyle = C.cream; g.font = '500 112px "Cormorant Garamond"'; g.letterSpacing = '6px';
  g.fillText(word, 323, 735);
  g.fillStyle = C.gold; g.font = '400 42px Inter'; g.letterSpacing = '8px';
  g.fillText(sub, 324, 830);
  const tx = new THREE.CanvasTexture(cv); tx.colorSpace = THREE.SRGBColorSpace; tx.anisotropy = 8; return tx;
}
const cards = [
  { word: 'SAFFRON', sub: 'TOP NOTE', motif: 'threads', t0: 3.7, from: [-1.6, 3.4, 8.5], to: [-0.95, 2.95, 4.0] },
  { word: 'AMBER', sub: 'HEART NOTE', motif: 'amber', t0: 4.3, from: [1.6, 2.2, 8.8], to: [0.88, 1.95, 4.4] },
  { word: 'OUD', sub: 'BASE NOTE', motif: 'wood', t0: 4.9, from: [-1.6, 0.6, 9.0], to: [-0.92, 0.95, 4.7] },
].map(c => {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(0.82, 1.153),
    new THREE.MeshBasicMaterial({ map: cardTex(c.word, c.sub, c.motif), transparent: true, opacity: 0, toneMapped: false, fog: false, side: THREE.DoubleSide }));
  scene.add(m); return { ...c, mesh: m };
});

// ---------- saffron threads drifting in the foreground ----------
const threads = [];
const threadMat = [new THREE.MeshStandardMaterial({ color: '#b8301c', roughness: 0.5, emissive: '#3a0a04' }),
                   new THREE.MeshStandardMaterial({ color: '#e0701e', roughness: 0.5, emissive: '#3a1404' })];
for (let i = 0; i < 34; i++) {
  const L = 0.16 + rnd() * 0.18;
  const curve = new THREE.QuadraticBezierCurve3(new THREE.Vector3(0, -L / 2, 0),
    new THREE.Vector3(L * 0.35 * (rnd() - .5), 0, L * 0.3 * (rnd() - .5)), new THREE.Vector3(0, L / 2, 0));
  const m = new THREE.Mesh(new THREE.TubeGeometry(curve, 12, 0.008 + rnd() * 0.006, 6), threadMat[i % 2]);
  const d = { m, base: new THREE.Vector3((rnd() - .5) * 4.5, 1.6 + rnd() * 3.2, -1.0 + rnd() * 4.8),
    vy: -0.05 - rnd() * 0.1, vx: (rnd() - .5) * 0.06, rs: new THREE.Vector3(rnd() - .5, rnd() - .5, rnd() - .5).multiplyScalar(1.2), r0: rnd() * 6.28 };
  scene.add(m); threads.push(d);
}

// ---------- gold dust ----------
const N = 700, dustPos = new Float32Array(N * 3), dust = [];
for (let i = 0; i < N; i++) dust.push({ x: (rnd() - .5) * 12, y: rnd() * 6, z: -6 + rnd() * 12, vx: (rnd() - .5) * .08, vy: .03 + rnd() * .1, ph: rnd() * 6.28 });
const dustGeo = new THREE.BufferGeometry(); dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
const dustMat = new THREE.PointsMaterial({ size: 0.045, map: radialTex([[0, 'rgba(255,243,214,1)'], [0.3, 'rgba(232,194,122,0.8)'], [1, 'rgba(232,194,122,0)']], 64),
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, sizeAttenuation: true, opacity: 0.9 });
scene.add(new THREE.Points(dustGeo, dustMat));

// ---------- post: subtle bloom on highlights only ----------
const composer = new EffectComposer(renderer);
composer.setSize(W, H);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(W / 2, H / 2), 0.32, 0.55, 0.82));
composer.addPass(new OutputPass());

// ---------- camera: one continuous move ----------
const camPath = new THREE.CatmullRomCurve3([
  new THREE.Vector3(1.3, 3.5, 4.4),
  new THREE.Vector3(2.4, 2.7, 8.6),
  new THREE.Vector3(1.1, 1.8, 14.0),
  new THREE.Vector3(0.0, 1.3, 19.5),
]);
const lookPath = new THREE.CatmullRomCurve3([
  new THREE.Vector3(0, 2.75, 0), new THREE.Vector3(0, 2.0, 0), new THREE.Vector3(0, 1.1, 0), new THREE.Vector3(0, 0.35, 0),
]);

// ---------- 2D type layer ----------
const out = document.getElementById('out');
const ctx = out.getContext('2d');

function text(str, x, y, font, spacing, color, alpha, blur = 0) {
  if (alpha <= 0.001) return;
  ctx.save();
  ctx.globalAlpha = alpha; ctx.font = font; ctx.letterSpacing = spacing + 'px';
  ctx.textAlign = 'center'; ctx.fillStyle = color;
  if (blur > 0.3) ctx.filter = `blur(${blur}px)`;
  ctx.fillText(str, x + spacing / 2, y);
  ctx.restore();
}

function typeLayer(t) {
  // keep the ground under the title dark (MOTION.md §5)
  const shade = eInOut(prog(t, 6.8, 8.0));
  let g = ctx.createLinearGradient(0, 1000, 0, 1920);
  g.addColorStop(0, 'rgba(7,4,10,0)'); g.addColorStop(0.09, `rgba(7,4,10,${0.88 * shade})`); g.addColorStop(1, `rgba(7,4,10,${0.97 * shade})`);
  ctx.fillStyle = g; ctx.fillRect(0, 1000, W, 920);

  // hook, on a soft dark band so it reads over the glass
  const hb = env(t, 0.4, 1.2, 2.4, 2.9);
  if (hb > 0) {
    const hg = ctx.createLinearGradient(0, 1040, 0, 1340);
    hg.addColorStop(0, 'rgba(7,4,10,0)'); hg.addColorStop(0.5, `rgba(7,4,10,${0.62 * hb})`); hg.addColorStop(1, 'rgba(7,4,10,0)');
    ctx.fillStyle = hg; ctx.fillRect(0, 1040, W, 300);
  }
  const a1 = env(t, 0.5, 1.3, 2.4, 2.9);
  text('Some nights', 540, 1190 + (1 - eOut(prog(t, 0.5, 1.3))) * 24, 'italic 300 120px "Cormorant Garamond"',
    lerp(14, 2, eOut(prog(t, 0.5, 1.6))), C.cream, a1, (1 - a1) * 8);
  const a2 = env(t, 0.9, 1.7, 2.4, 2.9);
  text('ARE MADE TO BE REMEMBERED', 540, 1270 + (1 - eOut(prog(t, 0.9, 1.7))) * 24, '300 26px Inter',
    lerp(16, 9, eOut(prog(t, 0.9, 2.0))), C.gold, a2, (1 - a2) * 6);

  // wordmark, letter by letter
  if (t > 7.2) {
    const name = 'ORVELLE';
    ctx.save();
    ctx.font = '300 130px "Cormorant Garamond"'; ctx.letterSpacing = '0px'; ctx.textAlign = 'left';
    const sp = lerp(44, 28, eOut(prog(t, 7.3, 8.8)));
    const ws = [...name].map(ch => ctx.measureText(ch).width);
    let x = 540 - (ws.reduce((a, b) => a + b, 0) + sp * (name.length - 1)) / 2;
    [...name].forEach((ch, i) => {
      const k = eOut(prog(t, 7.3 + i * 0.07, 8.1 + i * 0.07));
      if (k > 0) {
        ctx.save(); ctx.globalAlpha = k; ctx.fillStyle = C.gold;
        if (k < 1) ctx.filter = `blur(${(1 - k) * 8}px)`;
        ctx.fillText(ch, x, 1150 + (1 - k) * 24); ctx.restore();
      }
      x += ws[i] + sp;
    });
    ctx.restore();
    const dk = eInOut(prog(t, 8.0, 8.7));
    ctx.fillStyle = C.gold; ctx.globalAlpha = 0.85; ctx.fillRect(540 - 100 * dk, 1192, 200 * dk, 1.5); ctx.globalAlpha = 1;
    const b = eOut(prog(t, 8.1, 8.9));
    text('MIDNIGHT SAFFRON', 540, 1250 + (1 - b) * 24, '400 28px Inter', 12, C.cream, b);
    const c = eOut(prog(t, 8.5, 9.3));
    text('Eau de Parfum', 540, 1302 + (1 - c) * 24, 'italic 300 42px "Cormorant Garamond"', 3, C.gold, c);
    const d = eOut(prog(t, 7.6, 8.4));
    text('DISCOVER THE NIGHT', 540, 1392 + (1 - d) * 24, '300 22px Inter', 10, 'rgba(246,234,214,0.8)', d * (t > 8.9 ? 1 : eOut(prog(t, 8.9, 9.5))));
  }

  // vignette + fade from black
  g = ctx.createRadialGradient(540, 860, 520, 540, 960, 1250);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,0.6)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const fb = 1 - eOut(prog(t, 0, 0.6));
  if (fb > 0) { ctx.fillStyle = `rgba(0,0,0,${fb})`; ctx.fillRect(0, 0, W, H); }
}

// ---------- seek ----------
const v = new THREE.Vector3();
function seek(t) {
  t = clamp(t, 0, DUR);
  const u = eInOut(prog(t, 0, 8.8));
  camera.position.copy(camPath.getPointAt(u));
  camera.lookAt(lookPath.getPointAt(u));

  // bottle: slow quarter-turn settling to front, tiny float
  bottle.rotation.y = lerp(-0.55, 0, eInOut(prog(t, 0, 8.6)));
  bottle.position.y = Math.sin(t * 1.2) * 0.012;

  // key light sweeps once across the glass (0.6–4.2s), then rests front-left
  const sw = eInOut(prog(t, 0.6, 4.2));
  key.position.set(lerp(4.5, -2.6, sw), 4.6, lerp(1.5, 3.4, sw));
  key.intensity = lerp(40, 70, eOut(prog(t, 0.2, 2)));
  glow.material.opacity = 0.5 + 0.5 * eOut(prog(t, 2.0, 5.0));

  // cards: arrive from in front, hold, then drift out sideways
  for (const c of cards) {
    const kin = eOut(prog(t, c.t0, c.t0 + 0.9)), kout = eInOut(prog(t, 6.5, 7.3));
    c.mesh.position.set(
      lerp(c.from[0], c.to[0], kin) + Math.sign(c.to[0]) * kout * 2.2,
      lerp(c.from[1], c.to[1], kin) + Math.sin(t * 0.8 + c.t0) * 0.03,
      lerp(c.from[2], c.to[2], kin) - kout * 0.6);
    c.mesh.lookAt(camera.position);
    c.mesh.material.opacity = Math.min(kin, 1 - kout);
    c.mesh.visible = c.mesh.material.opacity > 0.002;
  }

  for (const d of threads) {
    let y = d.base.y + d.vy * t; if (y < 0.2) y += 4;
    d.m.position.set(d.base.x + d.vx * t + Math.sin(t * 0.7 + d.r0) * 0.05, y, d.base.z);
    d.m.rotation.set(d.r0 + d.rs.x * t, d.rs.y * t, d.rs.z * t);
  }
  const ta = 1 - eInOut(prog(t, 5.5, 7.0));
  threadMat.forEach(m => { m.transparent = true; m.opacity = ta; });
  threads.forEach(d => d.m.visible = ta > 0.01);

  for (let i = 0; i < N; i++) {
    const p = dust[i];
    dustPos[i * 3] = p.x + p.vx * t + Math.sin(t * 0.9 + p.ph) * 0.06;
    dustPos[i * 3 + 1] = ((p.y + p.vy * t) % 6 + 6) % 6;
    dustPos[i * 3 + 2] = p.z;
  }
  dustGeo.attributes.position.needsUpdate = true;
  dustMat.opacity = 0.9 * (0.75 + 0.25 * Math.sin(t * 3));

  composer.render();
  ctx.clearRect(0, 0, W, H);
  ctx.drawImage(renderer.domElement, 0, 0, W, H);
  typeLayer(t);
}
window.seek = seek;
window.DUR = DUR;

window.ready = document.fonts.load('300 100px "Cormorant Garamond"')
  .then(() => Promise.all([document.fonts.load('italic 300 100px "Cormorant Garamond"'), document.fonts.load('500 100px "Cormorant Garamond"'),
    document.fonts.load('300 20px Inter'), document.fonts.load('400 20px Inter')]))
  .then(() => {
    // textures that use fonts are drawn now, after fonts load
    label.material.map = labelTex(); label.material.needsUpdate = true;
    cards.forEach(c => { c.mesh.material.map = cardTex(c.word, c.sub, c.motif); c.mesh.material.needsUpdate = true; });
    seek(0); return true;
  });

// autoplay on a loop when opened normally; wait for seek when the URL has ?render
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
if (!new URLSearchParams(location.search).has('render')) {
  window.ready.then(() => {
    if (reduced) { seek(9.6); return; }
    const t0 = performance.now();
    (function loop() { seek(((performance.now() - t0) / 1000) % DUR); requestAnimationFrame(loop); })();
  });
}
</script>
